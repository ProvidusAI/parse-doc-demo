# The site plus an ngrok tunnel, both restarted by Docker after a crash or reboot. Setup steps: SETUP.md (not in git, shared by hand).
#   docker compose up -d --build      start or update both
#   docker compose up -d --build app  the site only, without the tunnel
# NGROK_AUTHTOKEN and NGROK_DOMAIN come from a .env file next to this one (git-ignored).
services:
  app:
    build: .
    image: providus-bench
    restart: unless-stopped
    ports:
      - "3001:3000"

  ngrok:
    image: ngrok/ngrok:3.39.13-debian  # pinned (what :latest was on 2026-11-20); bump on purpose, not on restart
    restart: unless-stopped
    depends_on:
      - app
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: ["http", "app:3000", "--url=${NGROK_DOMAIN}"]
    # ngrok's inspector shows and replays every visitor's requests: this Mac only, never the office network
    ports:
      - "127.0.0.1:4040:4040"
